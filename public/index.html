<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantieri</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cantieri">
<meta name="theme-color" content="#3a5a78">
<style>
:root{
  --bg:#f3f5f7; --card:#fff; --line:#d9dee4; --text:#1f2a35; --muted:#66727f;
  --blu:#3a5a78; --verde:#4a7a5c; --ambra:#a87b2e; --rosso:#a5463f;
  --ardesia:#56677a; --petrolio:#2f6b73; --oliva:#5d6b3f; --indaco:#4b5281; --bronzo:#7a5a3c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--blu);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;min-height:36px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--blu);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:underline}
.crumb b{color:var(--text);font-weight:600}
.ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 8px}
.titolo{font-size:18px;font-weight:700;margin:0 0 2px}
.sotto{font-size:13px;color:var(--muted);margin-bottom:10px}
.griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:620px){.griglia{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--blu)}
.tile .t{font-weight:600;font-size:14px}
.tile .s{font-size:12px;color:var(--muted)}
.tile.avviso{border-left:4px solid var(--ambra)}
.tile.allerta{border-left:4px solid var(--rosso)}
.riga{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lista > .riga:first-child{border-top:0}
.riga.click{cursor:pointer}
.riga .testo{flex:1;min-width:0}
.riga .testo .n{font-weight:600}
.riga .testo .d{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;color:#fff}
.freccia{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.spunta{width:22px;height:22px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;flex:none}
.spunta svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.vuoto{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.btn{display:inline-block;border:1px solid var(--blu);color:var(--blu);background:#fff;border-radius:6px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.pieno{background:var(--blu);color:#fff}
.btn.verde{border-color:var(--verde);color:var(--verde)}
.btn.rosso{border-color:var(--rosso);color:var(--rosso)}
.btn.grande{display:block;width:100%;padding:12px;font-size:15px;text-align:center;white-space:normal}
.barra-az{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
details.allerta{border-left:4px solid var(--rosso)}
details.avviso{border-left:4px solid var(--ambra)}
summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .conta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
details[open] summary .freccia{transform:rotate(90deg)}
details .dentro{padding:0 12px 8px}
.msg{border-top:1px solid var(--line);padding:10px 0}
.msg:first-child{border-top:0}
.msg .chi{font-size:12px;color:var(--muted)}
.msg .testo-m{margin:4px 0 8px}
.campo{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;margin:4px 0 10px;background:#fff;color:var(--text)}
label.et{font-size:13px;font-weight:600;color:var(--muted)}
.scelte{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.scelte button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
.scelte button.on{background:var(--blu);border-color:var(--blu);color:#fff}
.interr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.interr:first-child{border-top:0}
.sw{width:44px;height:26px;border-radius:13px;background:#c9d0d7;position:relative;cursor:pointer;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--verde)}
.sw.on::after{left:21px}
.riquadro-avviso{border:1px solid var(--ambra);background:#f7f3ea;border-radius:8px;padding:10px 12px;font-size:13px;margin:6px 0 10px}
.grande-ora{font-size:30px;font-weight:700;color:var(--blu);line-height:1}
.qr{width:120px;height:120px;margin:6px auto;display:block}
.nota{font-size:12px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;background:#f8f9fb}
.num-c{text-align:right}
/* firma */
.velo{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.velo.aperto{display:flex}
.foglio{background:#fff;width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:14px 16px 18px}
@media (min-width:600px){.velo{align-items:center}.foglio{border-radius:12px}}
.foglio canvas{width:100%;height:170px;border:1px dashed var(--muted);border-radius:8px;touch-action:none;background:#fafbfc;display:block}
.autodich{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:10px 0}
/* calendario */
.cal{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.cal th,.cal td{border:1px solid var(--line);padding:4px;vertical-align:top;text-align:left}
.cal th{background:#f8f9fb;color:var(--muted);font-weight:600}
.cal td.nome{font-weight:600;font-size:12px;width:78px}
.chip{display:block;border-radius:5px;padding:3px 5px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;line-height:1.25;word-break:break-word}
.chip.vuoto-c{background:#fff;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.prog{height:10px;background:#e6eaee;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--verde)}
.foto{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.foto div{aspect-ratio:4/3;border-radius:6px;background:#dfe5ea;display:flex;align-items:flex-end;padding:4px;font-size:11px;color:var(--text)}
.cifre{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.cifre .v{font-size:18px;font-weight:700}
.cifre .l{font-size:11px;color:var(--muted)}
.tessera{border:2px solid var(--blu);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;background:#fff;max-width:420px;margin:0 auto}
.tessera .fotot{width:84px;height:104px;border-radius:8px;background:#dfe5ea;display:flex;align-items:center;justify-content:center;flex:none}
.tessera .fotot svg{width:44px;height:44px;stroke:#8a96a3;fill:none;stroke-width:1.6}
.tessera .r{font-size:12px;color:var(--muted)}
.tessera .v{font-size:14px;font-weight:600;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;display:none;z-index:20}
/* giro guidato */
body.giro .wrap{padding-bottom:320px}
body.giro .toast{bottom:auto;top:64px}
.gg{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:3px solid var(--blu);box-shadow:0 -6px 18px rgba(20,30,40,.12);display:none}
body.giro .gg{display:block}
.gg-in{max-width:760px;margin:0 auto;padding:10px 16px 12px}
.gg-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.gg-top .chi{color:#fff;font-weight:600;border-radius:20px;padding:2px 8px;font-size:11px}
.gg-top .rid{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;color:var(--text)}
.gg-bar{height:5px;background:#e6eaee;border-radius:4px;overflow:hidden;margin:6px 0 8px}
.gg-bar i{display:block;height:100%;background:var(--blu)}
.gg-t{font-weight:700;font-size:15px;margin-bottom:3px}
.gg-x{font-size:13.5px;line-height:1.45}
.gg-f{font-size:13px;margin-top:6px;background:#eef3f8;border-radius:7px;padding:6px 9px}
.gg-f b{color:var(--blu)}
.gg-ok{color:var(--verde);font-weight:600}
.gg-btn{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.gg-btn .btn{flex:1;text-align:center;min-width:0}
.gg-nota textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;margin-top:8px;min-height:44px;height:44px}
.gg.mini .gg-x,.gg.mini .gg-f,.gg.mini .gg-nota,.gg.mini .gg-bar{display:none}
body.giro.gmin .wrap{padding-bottom:120px}
.tile.giro-t{grid-column:1/-1;border:2px solid var(--blu);background:#f4f7fa}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .testo{flex:1;min-width:0}
.chk .testo .n{font-weight:600}
.chk .testo .d{font-size:12px;color:var(--muted)}
.selm{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.selm button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
.selm button.on{background:var(--blu);border-color:var(--blu);color:#fff}
.due{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.due>div{min-width:0}
.nota-g{white-space:pre-wrap;font-size:13px;background:#f8f9fb;border-radius:6px;padding:6px 8px;margin-top:4px}
/* anteprima 07: calendario e cantieri */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk b{flex:1;text-align:center;font-size:14px}
.pc{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.pc-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f9fb;border-bottom:1px solid var(--line)}
.pc-h .n{font-weight:700;flex:1;min-width:0}
.pc-r{font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
summary.pc-h{list-style:none;cursor:pointer}
.pc[open]>summary .freccia{transform:rotate(90deg)}
.pc{display:block}
.dr{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line)}
.dr:first-of-type{border-top:0}
.dr .g{width:74px;flex:none;font-size:13px;font-weight:600;color:var(--muted);line-height:1.3}
.dr .w{flex:1;min-width:0}
.dr .w .c{font-weight:600;display:flex;align-items:center;gap:6px}
.dr .w .a{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.dr .w .o{font-size:12px;color:var(--muted)}
.sq{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dr.lib .w .c{color:var(--muted);font-weight:500}
.dr.av{background:#f7f3ea}
.tag-av{font-size:11px;font-weight:600;color:var(--ambra)}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--blu);cursor:pointer;flex:none;white-space:nowrap}
.mn{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.mn.aperto{display:flex}
.mn .foglio{max-height:88vh;overflow:auto}
@media (min-width:600px){.mn{align-items:center}}
.mn-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.mn-h .t{font-weight:700;font-size:16px}
.mn-h .s{font-size:13px;color:var(--muted)}
.mn-h .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;flex:none}
.mn-o{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:7px;font:inherit;cursor:pointer;color:var(--text)}
.mn-o .ico{width:30px;height:30px}
.mn-o .tt{flex:1;min-width:0}
.mn-o .tt b{display:block;font-size:14px}
.mn-o .tt span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.mn-o.on{border:2px solid var(--blu);background:#f4f7fa}
.mn-o.ros b{color:var(--rosso)}
.prev{background:#eef3f8;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.prev .q{font-size:12px;color:var(--muted);margin-bottom:3px}
.ca{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;margin-bottom:10px}
.ca .nm{font-weight:700;font-size:16px}
.ca .ad{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.ca .ad svg{width:18px;height:18px;stroke:var(--petrolio);fill:none;stroke-width:2;flex:none;margin-top:1px}
.ca .mt{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-top:8px}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{min-width:0;overflow-wrap:anywhere}

/* anteprima 08: tutto più semplice */
header{position:sticky;top:0;z-index:5}
.wrap{padding-bottom:96px}
.big-t{font-size:22px;font-weight:700;margin:2px 0 2px}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.blk-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px}
.wh{border-top:1px solid var(--line);padding:8px 0}
.wh:nth-child(2){border-top:0;padding-top:0}
.wh-c{display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:4px}
.wh-p{display:flex;align-items:center;gap:8px;padding:5px 0 5px 4px}
.wh-p .nm{font-weight:600;flex:1;min-width:0}
a.btn{text-decoration:none}
.st{font-size:12.5px;font-weight:600}.st.ok{color:var(--verde)}.st.a{color:var(--ambra)}.st.r{color:var(--rosso)}
.no-t{width:22px;height:22px;border-radius:50%;border:2px solid var(--rosso);flex:none}
.td{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.blk .td:nth-child(2){border-top:0}
.td-x{flex:1;min-width:180px}.td-x b{display:block}.td-x span{font-size:12.5px;color:var(--muted)}
.td-b{display:flex;gap:6px}
.vuoto-ok{display:flex;gap:10px;align-items:center;color:var(--verde);font-weight:600}
.sq.big{width:14px;height:14px;border-radius:4px;margin-top:4px}
.ca.click{cursor:pointer}.ca.click:hover{border-color:var(--blu)}
details.sz{margin-bottom:8px}
.sz-s{font-size:12.5px;color:var(--muted);font-weight:400}
.dr .w b{font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bar button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:var(--blu);font-weight:700}
.bar button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--blu);border-radius:0 0 3px 3px}
.bar i{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rosso);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
@media (min-width:900px){.bar{left:50%;transform:translateX(-50%);max-width:760px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}}
.req{border:2px solid var(--ambra);background:#f7f3ea;border-radius:12px;padding:12px;margin:12px 0}
.req-t{font-weight:700;color:var(--ambra);font-size:15px}
.req-m{margin-top:4px;font-size:14px}
.wh-s{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.slot+.slot{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.phone{max-width:380px;margin:0 auto;border:2px solid var(--line);border-radius:20px;padding:12px;background:#f8f9fb}
.ph-h{font-weight:700;font-size:16px;margin-bottom:4px}
header h1 span{display:block;font-size:13px;font-weight:400;opacity:.85}
header h1 a{color:#fff;text-decoration:underline;cursor:pointer}
body.opv header{background:var(--indaco)}
.who{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin:8px 0;font:inherit;font-size:18px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.who.big{padding:22px 16px;font-size:22px}.who .ico{width:44px;height:44px}.who .ico svg{width:24px;height:24px}
.wait{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:10px 0}
.wait-n{font-size:20px;font-weight:700;margin:10px 0}.wait-c{font-size:44px;font-weight:800;letter-spacing:.15em;color:var(--blu);margin:4px 0 8px}
.cod-in{font-size:18px;letter-spacing:.1em;color:var(--blu)}
.pin-d{font-size:34px;letter-spacing:.3em;text-align:center;margin:10px 0;color:var(--blu)}.pin-d span{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto 14px}
.pad button{font:inherit;font-size:26px;font-weight:600;padding:16px 0;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--text)}
.who.on{border:2px solid var(--blu);background:#f4f7fa}.lg-c{font-size:12px;font-weight:700;color:var(--muted);width:30px}.lg-s{color:var(--verde);font-weight:700}
.tr-or{font-size:12px;color:var(--muted);margin-top:4px;direction:ltr;text-align:left}
.punti{display:flex;align-items:center;gap:14px}
.num{font-size:40px;font-weight:700;line-height:1;color:var(--blu)}
.num small{font-size:15px;color:var(--muted);font-weight:500}
.barra{position:relative;height:12px;background:#e6eaee;border-radius:6px;margin:12px 0 4px;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;background:var(--verde);border-radius:6px}
.soglia{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.barra-leg{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

function qrFinto(){var s='',seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280;}
 function quad(x,y){s+='<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#1f2a35"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#1f2a35"/>';}
 for(var y=0;y<29;y++)for(var x=0;x<29;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;if(r()>.55)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#1f2a35"/>';}
 quad(0,0);quad(22,0);quad(0,22);return s;}
